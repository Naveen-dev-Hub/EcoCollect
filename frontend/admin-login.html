<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" href="favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EcoCollect Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f5;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #198754;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #198754;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            background: #146c43;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <div class="login-box">

        <h1>♻️ EcoCollect</h1>

        <p class="subtitle">
            Admin Login
        </p>

        <form id="loginForm">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter admin email"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                🔐 Login
            </button>

        </form>

        <div id="message"></div>

    </div>


    <script>

    document
        .getElementById("loginForm")
        .addEventListener("submit", async function (event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("message");

            message.style.color = "#666";
            message.textContent = "Logging in...";

            try {

                const response = await fetch(
                    "http://localhost:5000/api/admin/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );

                const result =
                    await response.json();

                console.log(
                    "Login response:",
                    result
                );

                if (
                    response.ok &&
                    result.success
                ) {

                    message.style.color = "green";
                    

                    message.textContent =
                        "Login successful!";
                        localStorage.setItem("adminLoggedIn", "true");
                        sessionStorage.setItem("adminLoggedIn", "true");

                    setTimeout(function () {

                        window.location.href =
                            "admin.html";

                    }, 1000);

                } else {

                    message.style.color = "red";

                    message.textContent =
                        result.message ||
                        "Invalid email or password.";

                }

            } catch (error) {

                console.error(
                    "Login error:",
                    error
                );

                message.style.color = "red";

                message.textContent =
                    "Unable to connect to backend.";

            }

        });



    </script>

</body>

</html>
