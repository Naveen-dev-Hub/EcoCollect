<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EcoCollect - Login</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-green-50 flex items-center justify-center px-4 py-8">

    <!-- Login Card -->
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">

        <!-- Logo -->
        <div class="text-center mb-8">

            <div class="inline-flex items-center justify-center
                        w-14 h-14 rounded-full bg-green-100 mb-3">
                <span class="text-3xl">♻️</span>
            </div>

            <h1 class="text-3xl font-bold text-green-700">
                EcoCollect
            </h1>

            <h2 class="text-xl font-semibold text-gray-800 mt-2">
                Welcome Back
            </h2>

            <p class="text-gray-500 text-sm mt-1">
                Login to manage your EcoCollect account
            </p>

        </div>


        <!-- Login Form -->
        <form id="loginForm" class="space-y-5">

            <!-- Email -->
            <div>

                <label
                    for="email"
                    class="block text-sm font-medium text-gray-700 mb-2">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                    class="w-full px-4 py-3 border border-gray-300
                           rounded-lg outline-none
                           focus:ring-2 focus:ring-green-500
                           focus:border-green-500"
                >

            </div>


            <!-- Password -->
            <div>

                <div class="flex justify-between items-center mb-2">

                    <label
                        for="password"
                        class="text-sm font-medium text-gray-700">
                        Password
                    </label>

                    <a
                        href="#"
                        class="text-sm text-green-600
                               hover:text-green-700">
                        Forgot Password?
                    </a>

                </div>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    class="w-full px-4 py-3 border border-gray-300
                           rounded-lg outline-none
                           focus:ring-2 focus:ring-green-500
                           focus:border-green-500"
                >

            </div>


            <!-- Remember Me -->
            <div class="flex items-center gap-2">

                <input
                    type="checkbox"
                    id="remember"
                    class="w-4 h-4 accent-green-600"
                >

                <label
                    for="remember"
                    class="text-sm text-gray-600">
                    Remember me
                </label>

            </div>


            <!-- Login Button -->
            <div class="flex justify-center pt-2">

                <button
                    type="submit"
                    class="px-10 py-3 bg-green-600 text-white
                           rounded-lg font-semibold
                           hover:bg-green-700
                           active:scale-95
                           transition duration-200
                           shadow-md"
                >
                    Login
                </button>

            </div>

        </form>


        <!-- Message -->
        <p
            id="message"
            class="text-center text-sm mt-5 font-medium">
        </p>


        <!-- Sign Up -->
        <div class="text-center mt-6 pt-5 border-t border-gray-200">

            <p class="text-gray-600 text-sm">

                Don't have an account?

                <a
                    href="signup.html"
                    class="text-green-600 font-semibold
                           hover:text-green-700">
                    Sign Up
                </a>

            </p>

        </div>

    </div>


    <!-- JavaScript -->
    <script>

const loginForm = document.getElementById("loginForm");
const message = document.getElementById("message");

loginForm.addEventListener("submit", async function (event) {

    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    message.textContent = "";

    try {

        const response = await fetch("http://localhost:5000/api/login", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                email: email,
                password: password
            })
        });

        const data = await response.json();

        console.log("LOGIN RESPONSE:", data);

        // WRONG EMAIL OR PASSWORD
        if (!response.ok || !data.success) {

            message.textContent =
                data.message || "Wrong email or password.";

            message.className =
                "text-center text-sm mt-5 font-medium text-red-600";

            return;
        }

        // LOGIN SUCCESS
        localStorage.setItem("ecocollectLoggedIn", "true");
        localStorage.setItem(
            "ecocollectUser",
            JSON.stringify(data.user)
        );

        message.textContent = "Login successful!";

        message.className =
            "text-center text-sm mt-5 font-medium text-green-600";

        // GO TO HOME PAGE
        setTimeout(() => {
            window.location.href = "./index.html";
        }, 500);

    } catch (error) {

        console.error("LOGIN ERROR:", error);

        message.textContent =
            "Unable to connect to backend server.";

        message.className =
            "text-center text-sm mt-5 font-medium text-red-600";
    }

});



    </script>

</body>
</html>
