<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EcoCollect - My Dashboard</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f3f7f5;
            color: #17212b;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* =========================
           NAVBAR
        ========================= */

        .navbar-custom {
            background: white;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            padding: 14px 5%;
        }

        .brand {
            color: #198754;
            font-size: 28px;
            font-weight: 700;
            text-decoration: none;
        }

        .nav-btn {
            border: 1px solid #198754;
            background: white;
            color: #198754;
            padding: 9px 18px;
            border-radius: 8px;
            text-decoration: none;
            margin-left: 8px;
        }

        .nav-btn:hover {
            background: #198754;
            color: white;
        }

        .logout-btn {
            background: #dc3545;
            border: none;
            color: rgb(20, 20, 20);
            padding: 9px 18px;
            border-radius: 8px;
            margin-left: 8px;
        }

        /* =========================
           MAIN
        ========================= */

        .dashboard-container {
            width: 90%;
            max-width: 1400px;
            margin: 55px auto;
        }

        .dashboard-title {
            margin-bottom: 35px;
        }

        .dashboard-title h1 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .dashboard-title p {
            font-size: 18px;
            color: #667085;
        }

        /* =========================
           PROFILE
        ========================= */

        .profile-card {
            background: white;
            border-radius: 18px;
            padding: 30px;
            margin-bottom: 35px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.07);
        }

        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .profile-header h2 {
            margin: 0;
            font-size: 26px;
        }

        .profile-input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            font-size: 16px;
        }

        .profile-input:focus {
            outline: none;
            border-color: #198754;
            box-shadow: 0 0 0 3px rgba(25,135,84,0.12);
        }

        .profile-input[readonly] {
            background: #f8f9fa;
        }

        .profile-actions {
            margin-top: 25px;
        }

        .save-btn {
            background: #198754;
            border: none;
            color: white;
            padding: 11px 20px;
            border-radius: 8px;
        }

        .save-btn:hover {
            background: #146c43;
        }

        .cancel-btn {
            background: #6c757d;
            border: none;
            color: white;
            padding: 11px 20px;
            border-radius: 8px;
            margin-left: 8px;
        }

        .edit-btn {
            background: white;
            border: 1px solid #198754;
            color: #198754;
            padding: 9px 18px;
            border-radius: 8px;
        }

        /* =========================
           STATISTICS
        ========================= */

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            border-radius: 18px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.07);
        }

        .stat-number {
            font-size: 38px;
            font-weight: 700;
            color: #198754;
        }

        .stat-label {
            font-size: 17px;
            margin-top: 5px;
            color: #475467;
        }

        /* =========================
           REQUESTS
        ========================= */

        .requests-card {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.07);
        }

        .requests-card h2 {
            margin-bottom: 25px;
        }

        .request-item {
            border: 1px solid #e4e7ec;
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 18px;
        }

        .request-top {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .request-type {
            font-size: 21px;
            font-weight: 700;
        }

        .status-badge {
            display: inline-block;
            padding: 7px 13px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-approved {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status-assigned {
            background: #e2d9f3;
            color: #59359a;
        }

        .status-out {
            background: #cfe2ff;
            color: #084298;
        }

        .status-picked {
            background: #cff4fc;
            color: #055160;
        }

        .status-completed {
            background: #d1e7dd;
            color: #0f5132;
        }

        .status-rejected {
            background: #f8d7da;
            color: #842029;
        }

        .request-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .detail-label {
            color: #667085;
            font-size: 14px;
        }

        .detail-value {
            font-weight: 600;
        }

        .track-btn {
            display: inline-block;
            margin-top: 18px;
            background: #0d6efd;
            color: white;
            text-decoration: none;
            padding: 9px 16px;
            border-radius: 8px;
        }

        .track-btn:hover {
            background: #0b5ed7;
            color: white;
        }

        .empty-box {
            text-align: center;
            padding: 60px 20px;
            color: #667085;
        }

        .empty-box h3 {
            color: #17212b;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667085;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 900px) {

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .dashboard-title h1 {
                font-size: 34px;
            }

        }

        @media (max-width: 600px) {

            .dashboard-container {
                width: 94%;
                margin-top: 30px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .request-details {
                grid-template-columns: 1fr;
            }

            .profile-header {
                align-items: flex-start;
                gap: 15px;
                flex-direction: column;
            }

            .brand {
                font-size: 23px;
            }

        }

    </style>
</head>


<body>

<!-- ==================================================

<!-- ==================================================
     JAVASCRIPT
================================================== -->

<script>

const API_BASE =
    "http://localhost:5000";


// ======================================================
// USER DATA
// ======================================================

let user =
    JSON.parse(
        localStorage.getItem("ecocollectUser")
    );


// ======================================================
// CHECK LOGIN
// ======================================================

if (
    localStorage.getItem("ecocollectLoggedIn") !== "true" ||
    !user
) {

    window.location.href =
        "login.html";

}


// ======================================================
// USER ID
// IMPORTANT:
// LOGIN API RETURNS "id", NOT "_id"
// ======================================================

const userId =
    user?.id ||
    user?._id ||
    "";


// ======================================================
// USER INFORMATION
// ======================================================

let userName =
    user?.name ||
    "User";

let userEmail =
    user?.email ||
    "";

let userPhone =
    user?.phone ||
    "";


// ======================================================
// INITIAL PAGE
// ======================================================

document.addEventListener(
    "DOMContentLoaded",
    function () {

        loadUserInformation();

        loadMyPickups();

    }
);


// ======================================================
// LOAD USER INFORMATION
// ======================================================

function loadUserInformation() {

    document.getElementById(
        "welcomeText"
    ).textContent =
        `Welcome, ${userName} • ${userEmail}`;


    document.getElementById(
        "profileName"
    ).value =
        userName;


    document.getElementById(
        "profileEmail"
    ).value =
        userEmail;


    document.getElementById(
        "profilePhone"
    ).value =
        userPhone;

}


// ======================================================
// EDIT PROFILE
// ======================================================

function enableProfileEdit() {

    document.getElementById(
        "profileName"
    ).readOnly = false;


    document.getElementById(
        "profilePhone"
    ).readOnly = false;


    document.getElementById(
        "profileEmail"
    ).readOnly = true;


    document.getElementById(
        "profileActions"
    ).style.display =
        "block";


    document.getElementById(
        "editProfileBtn"
    ).style.display =
        "none";

}


// ======================================================
// CANCEL PROFILE EDIT
// ======================================================

function cancelProfileEdit() {

    document.getElementById(
        "profileName"
    ).value =
        user.name || "";


    document.getElementById(
        "profilePhone"
    ).value =
        user.phone || "";


    document.getElementById(
        "profileName"
    ).readOnly = true;


    document.getElementById(
        "profilePhone"
    ).readOnly = true;


    document.getElementById(
        "profileActions"
    ).style.display =
        "none";


    document.getElementById(
        "editProfileBtn"
    ).style.display =
        "inline-block";


    document.getElementById(
        "profileMessage"
    ).textContent = "";

}


// ======================================================
// SAVE PROFILE
// ======================================================

async function saveProfile() {

    const name =
        document.getElementById(
            "profileName"
        ).value.trim();


    const phone =
        document.getElementById(
            "profilePhone"
        ).value.trim();


    const message =
        document.getElementById(
            "profileMessage"
        );


    if (!name || !phone) {

        message.textContent =
            "Name and phone are required.";

        message.className =
            "mt-3 mb-0 text-danger fw-semibold";

        return;

    }


    if (!userId) {

        message.textContent =
            "User ID not found. Please login again.";

        message.className =
            "mt-3 mb-0 text-danger fw-semibold";

        console.error(
            "USER OBJECT:",
            user
        );

        return;

    }


    message.textContent =
        "Saving profile...";

    message.className =
        "mt-3 mb-0 text-primary fw-semibold";


    try {

        console.log(
            "Updating user:",
            userId
        );


        const response =
            await fetch(
                `${API_BASE}/api/users/${userId}`,
                {
                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        name: name,
                        phone: phone
                    })
                }
            );


        const data =
            await response.json();


        console.log(
            "PROFILE UPDATE RESPONSE:",
            data
        );


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Profile update failed."
            );

        }


        // Update local user object

        user =
            data.user;


        // Keep ID because backend may return
        // MongoDB _id instead of id

        if (!user.id) {

            user.id =
                user._id;

        }


        // Update localStorage

        localStorage.setItem(
            "ecocollectUser",
            JSON.stringify(user)
        );


        // Update variables

        userName =
            user.name || "User";

        userEmail =
            user.email || "";

        userPhone =
            user.phone || "";


        // Refresh page information

        loadUserInformation();


        // Lock fields

        document.getElementById(
            "profileName"
        ).readOnly = true;

        document.getElementById(
            "profilePhone"
        ).readOnly = true;


        // Hide action buttons

        document.getElementById(
            "profileActions"
        ).style.display =
            "none";


        document.getElementById(
            "editProfileBtn"
        ).style.display =
            "inline-block";


        message.textContent =
            "✅ Profile updated successfully!";

        message.className =
            "mt-3 mb-0 text-success fw-semibold";


    } catch (error) {

        console.error(
            "PROFILE UPDATE ERROR:",
            error
        );


        message.textContent =
            error.message ||
            "Unable to update profile.";

        message.className =
            "mt-3 mb-0 text-danger fw-semibold";

    }

}


// ======================================================
// LOAD MY PICKUP REQUESTS
// ======================================================

async function loadMyPickups() {

    const container =
        document.getElementById(
            "requestsContainer"
        );


    container.innerHTML =
        `<div class="loading">
            Loading your pickup requests...
        </div>`;


    try {

        // The current backend already exposes
        // GET /api/pickups for all pickup requests.
        // We filter them here using the logged-in user's email.

        const response =
            await fetch(
                `${API_BASE}/api/pickups`
            );


        if (!response.ok) {

            throw new Error(
                "Failed to load pickup requests."
            );

        }


        const data =
            await response.json();


        console.log(
            "ALL PICKUPS:",
            data
        );


        let pickups = [];


        if (
            Array.isArray(data)
        ) {

            pickups =
                data;

        }
        else if (
            Array.isArray(data.pickups)
        ) {

            pickups =
                data.pickups;

        }


        // ==================================================
        // FILTER CURRENT USER
        // ==================================================

        const myPickups =
            pickups.filter(
                function (pickup) {

                    return (
                        String(
                            pickup.email || ""
                        ).toLowerCase().trim()
                        ===
                        String(
                            userEmail || ""
                        ).toLowerCase().trim()
                    );

                }
            );


        updateStatistics(
            myPickups
        );


        displayMyPickups(
            myPickups
        );


    } catch (error) {

        console.error(
            "LOAD MY PICKUPS ERROR:",
            error
        );


        container.innerHTML =
            `<div class="empty-box">

                <h3>
                    Unable to load requests
                </h3>

                <p>
                    Make sure the backend server
                    is running on port 5000.
                </p>

                <button
                    class="btn btn-success"
                    onclick="loadMyPickups()">
                    Try Again
                </button>

            </div>`;

    }

}


// ======================================================
// UPDATE STATISTICS
// ======================================================

function updateStatistics(
    pickups
) {

    let pending = 0;
    let active = 0;
    let completed = 0;


    pickups.forEach(
        function (pickup) {

            const status =
                pickup.status ||
                "Pending";


            if (
                status === "Pending"
            ) {

                pending++;

            }


            if (
                status === "Approved" ||
                status === "Pickup Assigned" ||
                status === "Out for Pickup" ||
                status === "Picked Up"
            ) {

                active++;

            }


            if (
                status === "Completed"
            ) {

                completed++;

            }

        }
    );


    document.getElementById(
        "totalCount"
    ).textContent =
        pickups.length;


    document.getElementById(
        "pendingCount"
    ).textContent =
        pending;


    document.getElementById(
        "activeCount"
    ).textContent =
        active;


    document.getElementById(
        "completedCount"
    ).textContent =
        completed;

}


// ======================================================
// DISPLAY MY PICKUPS
// ======================================================

function displayMyPickups(
    pickups
) {

    const container =
        document.getElementById(
            "requestsContainer"
        );


    if (
        pickups.length === 0
    ) {

        container.innerHTML =
            `<div class="empty-box">

                <h3>
                    No Pickup Requests
                </h3>

                <p>
                    You have not submitted
                    any pickup requests yet.
                </p>

                <a
                    href="index.html#pickup"
                    class="btn btn-success">
                    Request a Pickup
                </a>

            </div>`;

        return;

    }


    // Newest first

    pickups.sort(
        function (a, b) {

            return (
                new Date(
                    b.createdAt || 0
                )
                -
                new Date(
                    a.createdAt || 0
                )
            );

        }
    );


    container.innerHTML = "";


    pickups.forEach(
        function (pickup) {

            const status =
                pickup.status ||
                "Pending";


            const statusClass =
                getStatusClass(
                    status
                );


            const date =
                pickup.createdAt
                    ? new Date(
                        pickup.createdAt
                    ).toLocaleString()
                    : "N/A";


            const pickupId =
                pickup._id ||
                pickup.id ||
                "";


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "request-item";


            item.innerHTML = `

                <div class="request-top">

                    <div class="request-type">

                        ${escapeHTML(
                            pickup.wasteType ||
                            "Waste Pickup"
                        )}

                    </div>


                    <span
                        class="status-badge ${statusClass}">

                        ${escapeHTML(
                            status
                        )}

                    </span>

                </div>


                <div class="request-details">

                    <div>

                        <div class="detail-label">
                            Weight
                        </div>

                        <div class="detail-value">
                            ${escapeHTML(
                                pickup.weight ||
                                "N/A"
                            )}
                        </div>

                    </div>


                    <div>

                        <div class="detail-label">
                            Location
                        </div>

                        <div class="detail-value">
                            ${escapeHTML(
                                pickup.location ||
                                "N/A"
                            )}
                        </div>

                    </div>


                    <div>

                        <div class="detail-label">
                            Mobile
                        </div>

                        <div class="detail-value">
                            ${escapeHTML(
                                pickup.mobile ||
                                "N/A"
                            )}
                        </div>

                    </div>


                    <div>

                        <div class="detail-label">
                            Date
                        </div>

                        <div class="detail-value">
                            ${escapeHTML(
                                date
                            )}
                        </div>

                    </div>

                </div>


                ${
                    pickup.message
                    ? `
                        <div class="mt-3">

                            <div class="detail-label">
                                Message
                            </div>

                            <div class="detail-value">
                                ${escapeHTML(
                                    pickup.message
                                )}
                            </div>

                        </div>
                    `
                    : ""
                }


                ${
                    pickupId
                    ? `
                        <a
                            href="tracking.html?id=${encodeURIComponent(
                                pickupId
                            )}"
                            class="track-btn">

                            📦 Track Pickup

                        </a>
                    `
                    : ""
                }

            `;


            container.appendChild(
                item
            );

        }
    );

}


// ======================================================
// STATUS CLASS
// ======================================================

function getStatusClass(
    status
) {

    switch (
        status
    ) {

        case "Pending":
            return "status-pending";

        case "Approved":
            return "status-approved";

        case "Pickup Assigned":
            return "status-assigned";

        case "Out for Pickup":
            return "status-out";

        case "Picked Up":
            return "status-picked";

        case "Completed":
            return "status-completed";

        case "Rejected":
            return "status-rejected";

        default:
            return "status-pending";

    }

}


// ======================================================
// HTML ESCAPE
// ======================================================

function escapeHTML(
    value
) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


// ======================================================
// LOGOUT
// ======================================================

function logoutUser() {

    const confirmed =
        confirm(
            "Are you sure you want to logout?"
        );


    if (!confirmed) {
        return;
    }


    localStorage.removeItem(
        "ecocollectLoggedIn"
    );


    localStorage.removeItem(
        "ecocollectUser"
    );


    window.location.href =
        "login.html";

}
// ======================================================
// CHANGE USER PASSWORD
// ======================================================


async function changePassword() {

    const currentPassword =
        document.getElementById("currentPassword").value.trim();

    const newPassword =
        document.getElementById("newPassword").value.trim();

    const confirmPassword =
        document.getElementById("confirmPassword").value.trim();

    const message =
        document.getElementById("passwordMessage");

    if (!currentPassword || !newPassword || !confirmPassword) {
        message.textContent = "Please fill all fields.";
        message.className = "mt-3 mb-0 fw-semibold text-danger";
        return;
    }

    if (newPassword !== confirmPassword) {
        message.textContent = "New passwords do not match.";
        message.className = "mt-3 mb-0 fw-semibold text-danger";
        return;
    }

    const storedUser =
        localStorage.getItem("ecocollectUser");

    console.log("STORED USER:", storedUser);

    if (!storedUser) {
        message.textContent = "User session not found.";
        message.className = "mt-3 mb-0 fw-semibold text-danger";
        return;
    }

    let user;

    try {
        user = JSON.parse(storedUser);
    } catch (error) {
        console.error("USER JSON ERROR:", error);

        message.textContent = "Invalid user session.";
        message.className = "mt-3 mb-0 fw-semibold text-danger";
        return;
    }

    const userId = user.id || user._id;

    console.log("USER ID:", userId);

    if (!userId) {
        message.textContent = "User ID not found.";
        message.className = "mt-3 mb-0 fw-semibold text-danger";
        return;
    }

    try {

        const response = await fetch(
            `http://localhost:5000/api/users/${userId}/password`,
            {
                method: "PUT",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    currentPassword: currentPassword,
                    newPassword: newPassword
                })
            }
        );

        console.log("STATUS:", response.status);
        console.log("STATUS TEXT:", response.statusText);
        console.log("CONTENT TYPE:",
            response.headers.get("content-type"));

        const text = await response.text();

        console.log("RAW SERVER RESPONSE:");
        console.log(text);

        if (!text) {
            message.textContent =
                "Server returned an empty response.";

            message.className =
                "mt-3 mb-0 fw-semibold text-danger";

            return;
        }

        let data;

        try {
            data = JSON.parse(text);
        } catch (error) {

            message.textContent =
                "Server returned invalid data. Check VS Code terminal.";

            message.className =
                "mt-3 mb-0 fw-semibold text-danger";

            console.error(
                "SERVER DID NOT RETURN JSON:",
                text
            );

            return;
        }

        console.log("JSON DATA:", data);

        if (!response.ok || !data.success) {

            message.textContent =
                data.message || "Password change failed.";

            message.className =
                "mt-3 mb-0 fw-semibold text-danger";

            return;
        }

        message.textContent =
            "Password changed successfully.";

        message.className =
            "mt-3 mb-0 fw-semibold text-success";

        document.getElementById(
            "currentPassword"
        ).value = "";

        document.getElementById(
            "newPassword"
        ).value = "";

        document.getElementById(
            "confirmPassword"
        ).value = "";

    } catch (error) {

        console.error("FETCH ERROR:", error);

        message.textContent =
            "Unable to connect to backend server.";

        message.className =
            "mt-3 mb-0 fw-semibold text-danger";
    }
}
